name: CI - Fog Kernel
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/aafiqbinkhayer-Toshiro/fog-kribo-157-hackX
          kernel-branch: fog-devel
          config: vendor/fog-perf_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          ksu: true
          ksu-version: v0.9.5 
          anykernel3: true
